services:
  gateway:
    build: ./gateway
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    mem_limit: 128m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    expose:
      - "80"
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  backend:
    build: ./backend
    environment:
      - PORT=3000
      - DB_PATH=/app/data/app.db
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
